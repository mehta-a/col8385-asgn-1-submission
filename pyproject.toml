[project]
name = "amp-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.4",
]

[project.scripts]
train = "amp_model.train:main"
generate = "amp_model.generate:main"
sample = "amp_model.sample:sample"
evaluate = "amp_model.sample:evaluate"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"